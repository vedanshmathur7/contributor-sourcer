services:
  - type: web
    name: contributor-sourcer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000

  - type: web
    name: contributor-sourcer
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Public URL of the API service (verify after the first deploy; Render may add a suffix).
      - key: NEXT_PUBLIC_API_URL
        value: https://contributor-sourcer-api.onrender.com
