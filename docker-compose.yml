services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sourcer
      POSTGRES_PASSWORD: sourcer
      POSTGRES_DB: sourcer
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcer"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sourcer:sourcer@db:5432/sourcer
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
